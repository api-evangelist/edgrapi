aid: edgrapi

name: Paper and Beyond

image: https://edgrapi.com/static/og-edgrapi.png

description: Paper and Beyond provides a US Government Data API for developers and AI agents, aggregating data from SAM.gov contracts, USAspending
  awards, Grants.gov, Congress trades, and SEC EDGAR into a single JSON schema. The service offers a hosted MCP server with a free tier, no credit
  card required, and supports REST access. It targets AI agents and developers needing comprehensive federal data via a unified API.

