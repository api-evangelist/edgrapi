openapi: 3.2.0
info:
  title: Edgrapi — US Government Data Search API
  description: Official US government data as clean JSON on one API key. SEC EDGAR filings (insider Form 4 trades, 8-K events, 13F fund holdings, 13D/13G activist stakes, financial statements and ratios), SAM.gov federal contract opportunities, USAspending awards, Grants.gov grant opportunities, and US House Congress stock trades. Hosted MCP server plus REST, with real-time webhooks when a watched company files. One key, one normalized schema.
  contact:
    name: Edgrapi
    url: https://edgrapi.com/
  license:
    name: Proprietary
  version: 1.0.0
tags:
- name: Search
paths:
  /v1/search/fulltext:
    get:
      tags:
      - Search
      summary: Full-text search across SEC filings
      description: 'Search the full text of every SEC filing since 2001, the same index behind

        EDGAR full-text search. Returns the matching filing documents with company, form,

        date, 8-K item codes, and a link to the document on SEC.gov. Filter by form and

        date range; page with `offset`.'
      operationId: search_fulltext_v1_search_fulltext_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          description: Query. Quote a phrase ("climate change") for exact match; space-separated terms are ANDed.
          title: Q
        description: Query. Quote a phrase ("climate change") for exact match; space-separated terms are ANDed.
      - name: forms
        in: query
        required: false
        schema:
          type: string
          description: Comma-separated form filter, e.g. 8-K or 10-K,10-Q
          title: Forms
        description: Comma-separated form filter, e.g. 8-K or 10-K,10-Q
      - name: startdt
        in: query
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Only filings on/after this date, YYYY-MM-DD
          title: Startdt
        description: Only filings on/after this date, YYYY-MM-DD
      - name: enddt
        in: query
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Only filings on/before this date, YYYY-MM-DD
          title: Enddt
        description: Only filings on/before this date, YYYY-MM-DD
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Results to return, 1-100
          default: 20
          title: Limit
        description: Results to return, 1-100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 9900
          minimum: 0
          description: Pagination offset into the result set
          default: 0
          title: Offset
        description: Pagination offset into the result set
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
